;================  Транспорт  =====================
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060           ; слухаємо 5060/UDP

;===============  Шаблони  ========================
[endpoint-basic](!)         ; (!) = шаблон, з нього наслідуємо
type=endpoint
context=public
allow=all
direct_media=no             ; щоб не переводив у direct-media

[aor-basic](!)
type=aor
max_contacts=1              ; достатньо одного контакту

; Add auth template for per-endpoint credentials
[auth-basic](!)
type=auth
auth_type=userpass

